spring.application.name=checkout-api

# Configuração do H2 Database em memória
spring.datasource.url=jdbc:h2:mem:checkoutdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console Web do H2 (acesse em /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuração do JPA / Hibernate (open-in-view desabilitado por boas práticas em APIs REST)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuração do Springdoc OpenAPI (Swagger UI em /swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
